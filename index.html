<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Buscador de Pokémon</title>
</head>
<body>

    <main>
        <h1>Buscar Pokémon</h1>

        <form id="formPoke">
            <input
                type="number"
                id="idPoke"
                placeholder="Digite o ID (ex: 25)"
                min="1"
                required>
            <button type="submit">Buscar</button>
        </form>

        <p id="msg"></p>

        <div id="resultado" class="hidden">
            <h2 id="nomePokemon"></h2>
            <img src="" alt="Imagem do Pokémon" id="imgPoke">
            
            <!-- Atributo original -->
            <p id="basePoke"></p>
            
            <!-- Novos atributos adicionados -->
            <p id="tipoPoke"></p>
            <p id="pesoPoke"></p>
        </div>
    </main>  
   
    <script src="main.js"></script>
</body>
</html>
